[project]
name = "quant-platform-api"
version = "0.0.0"
description = "Quant platform API, workers, pipelines, training — single-image multi-role application"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",

    # HTTP
    "httpx>=0.28",

    # Auth
    "authlib>=1.4",
    "pyjwt[crypto]>=2.10",

    # Database
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",

    # Data
    "polars>=1.19",
    "pandera[polars]>=0.22",
    "pyarrow>=18.1",

    # Storage
    "google-cloud-storage>=2.19",  # respects STORAGE_EMULATOR_HOST for MinIO
    "boto3>=1.35",  # alt S3 client for MinIO in some paths

    # Observability
    "structlog>=25.1",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-asyncpg>=0.51b0",

    # ML
    "mlflow>=2.20",
    "lightgbm>=4.5",
    "numpy>=2.0",
    "scikit-learn>=1.6",

    # Scheduling
    "apscheduler>=3.11",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "pyright>=1.1.391",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "UP", "B", "C4", "SIM", "PL", "RUF", "A", "S", "BLE",
]
ignore = [
    "PLR0913",  # too-many-arguments — framework endpoints naturally have many params
    "S101",     # assert — used in tests
    "PLW0603",  # global statement — intentional for lazy singleton init of engine/settings
    "B008",     # function calls in arg defaults — FastAPI Depends() idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "BLE001"]
"app/workers/base.py" = ["BLE001"]  # worker loop must catch everything to stay alive
"app/workers/training.py" = ["BLE001", "PLC0415"]  # lazy imports + broad-catch for resilience
"app/api/models.py" = ["PLC0415"]  # lazy import to avoid loading ml stack on common paths
"app/quant/pipeline.py" = ["E501"]  # inline SQL blocks are clearer left wide
"app/quant/serving.py" = ["PLC0415", "BLE001", "S608"]  # mlflow lazy import + broad MLflow errors
"app/quant/training.py" = ["PLC0415", "PLR2004", "S608"]  # mlflow lazy + numeric tol + safe f-string SQL
"app/quant/synthetic.py" = ["F841", "PLR2004"]  # template + weekday=5 const
"migrations/*" = ["E501"]  # SQL readability

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--strict-markers --strict-config -ra"
markers = [
    "unit: unit tests (no I/O, no network, no DB)",
    "integration: integration tests (require docker-compose stack)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
