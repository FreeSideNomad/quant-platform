name: quant-platform

# Base compose — used locally on Mac (with --profile local) and as the shared
# definition overlaid by docker-compose.vm.yml for the dev VM. Ports are chosen
# to avoid collisions with the LedgerTM stack on the VM (80/443/5432/6379/9094).

services:
  # ------------------------------------------------------------------
  # Local-only Postgres (PGMQ image, matches infra-postgres on the VM).
  # On the VM deploy, we do NOT start this; the app points at infra-postgres.
  # ------------------------------------------------------------------
  postgres:
    image: ghcr.io/pgmq/pg17-pgmq:latest

    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant
      POSTGRES_DB: quant
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./compose/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ------------------------------------------------------------------
  # MinIO — S3/GCS-compatible object storage for local dev.
  # ------------------------------------------------------------------
  minio:
    image: minio/minio:latest

    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Seed: create the default bucket once MinIO is up.
  minio-init:
    image: minio/mc:latest

    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/quant-bronze || true &&
      mc mb -p local/mlflow-artefacts || true &&
      exit 0"

  # ------------------------------------------------------------------
  # MLflow tracking server — Postgres backend, MinIO artefact store.
  # ------------------------------------------------------------------
  mlflow:
    build:
      context: ./compose/mlflow

    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://quant:quant@postgres:5432/mlflow
      --default-artifact-root s3://mlflow-artefacts/
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; urllib.request.urlopen('http://localhost:5000/health', timeout=2); sys.exit(0)"
      interval: 5s
      timeout: 3s
      retries: 20

  # ------------------------------------------------------------------
  # Mock OIDC provider — simulates customer Workspace/Entra locally.
  # ------------------------------------------------------------------
  mock-oidc:
    build:
      context: ./compose/mock-oidc

    ports:
      - "127.0.0.1:9800:9800"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; urllib.request.urlopen('http://localhost:9800/.well-known/openid-configuration', timeout=2); sys.exit(0)"
      interval: 5s
      timeout: 3s
      retries: 20

  # ------------------------------------------------------------------
  # Common app environment (anchored for reuse across roles).
  # ------------------------------------------------------------------
  # (use YAML anchors in the env blocks below instead of duplicating)

  # ------------------------------------------------------------------
  # API role — the main FastAPI application.
  # ------------------------------------------------------------------
  api:
    image: ghcr.io/freesidenomad/quant-platform:${IMAGE_TAG:-main-latest}
    build:
      context: .
    environment:
      ROLE: api
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://quant:quant@postgres:5432/quant
      STORAGE_BACKEND: minio
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: quant-bronze
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      OIDC_UPSTREAM_DISCOVERY_URL: http://mock-oidc:9800/.well-known/openid-configuration
      OIDC_UPSTREAM_CLIENT_ID: quant-platform
      OIDC_UPSTREAM_CLIENT_SECRET: mock-secret
      OIDC_UPSTREAM_NAME: mock
      OIDC_UPSTREAM_BROWSER_BASE: http://localhost:9800
      IDP_ISSUER: http://localhost:8001
      IDP_INTERNAL_URL: http://idp:8001
      IDP_CLIENT_ID: quant-bff
      IDP_CLIENT_SECRET: dev-bff-secret
      BFF_PUBLIC_URL: http://localhost:8080
      BFF_UPSTREAM_API_URL: http://api:8000
      BFF_SESSION_COOKIE_SECURE: "false"
      BFF_TOKEN_ENCRYPTION_KEY_B64: "MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUY="
      SESSION_JWT_SIGNING_KEY: dev-only-replace-in-prod
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      mock-oidc:
        condition: service_healthy

  # ------------------------------------------------------------------
  # IdP role — federates upstream, mints our JWTs, exposes /jwks.
  # ------------------------------------------------------------------
  idp:
    image: ghcr.io/freesidenomad/quant-platform:${IMAGE_TAG:-main-latest}
    build:
      context: .
    environment:
      ROLE: idp
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://quant:quant@postgres:5432/quant
      OIDC_UPSTREAM_DISCOVERY_URL: http://mock-oidc:9800/.well-known/openid-configuration
      OIDC_UPSTREAM_CLIENT_ID: quant-platform
      OIDC_UPSTREAM_CLIENT_SECRET: mock-secret
      OIDC_UPSTREAM_NAME: mock
      OIDC_UPSTREAM_BROWSER_BASE: http://localhost:9800
      IDP_ISSUER: http://localhost:8001
      IDP_INTERNAL_URL: http://idp:8001
      IDP_CLIENT_ID: quant-bff
      IDP_CLIENT_SECRET: dev-bff-secret
      IDP_SIGNING_KEY_ID: qp-dev-1
      IDP_SIGNING_KEY_B64: ""
      BFF_TOKEN_ENCRYPTION_KEY_B64: "MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUY="
      SESSION_JWT_SIGNING_KEY: dev-only-replace-in-prod
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      mock-oidc:
        condition: service_healthy

  # ------------------------------------------------------------------
  # BFF role — browser-facing reverse proxy, session cookies.
  # ------------------------------------------------------------------
  bff:
    image: ghcr.io/freesidenomad/quant-platform:${IMAGE_TAG:-main-latest}
    build:
      context: .
    environment:
      ROLE: bff
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://quant:quant@postgres:5432/quant
      IDP_ISSUER: http://localhost:8001
      IDP_INTERNAL_URL: http://idp:8001
      IDP_CLIENT_ID: quant-bff
      IDP_CLIENT_SECRET: dev-bff-secret
      BFF_PUBLIC_URL: http://localhost:8080
      BFF_UPSTREAM_API_URL: http://api:8000
      # Dev/CI only: plain HTTP → drop Secure + __Host- prefix. Prod always true.
      BFF_SESSION_COOKIE_SECURE: "false"
      BFF_TOKEN_ENCRYPTION_KEY_B64: "MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUY="
      SESSION_JWT_SIGNING_KEY: dev-only-replace-in-prod
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      idp:
        condition: service_started
      api:
        condition: service_started

  # ------------------------------------------------------------------
  # Worker roles — stamped from the same image, ROLE picks behaviour.
  # ------------------------------------------------------------------
  worker-proj-ui:
    image: ghcr.io/freesidenomad/quant-platform:${IMAGE_TAG:-main-latest}
    build:
      context: .
    environment:
      ROLE: worker-proj-ui
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://quant:quant@postgres:5432/quant
      SESSION_JWT_SIGNING_KEY: dev-only-replace-in-prod
    depends_on:
      postgres:
        condition: service_healthy

  worker-training:
    image: ghcr.io/freesidenomad/quant-platform:${IMAGE_TAG:-main-latest}
    build:
      context: .
    environment:
      ROLE: worker-training
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://quant:quant@postgres:5432/quant
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      SESSION_JWT_SIGNING_KEY: dev-only-replace-in-prod
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  scheduler:
    image: ghcr.io/freesidenomad/quant-platform:${IMAGE_TAG:-main-latest}
    build:
      context: .
    environment:
      ROLE: scheduler
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://quant:quant@postgres:5432/quant
      SESSION_JWT_SIGNING_KEY: dev-only-replace-in-prod
    depends_on:
      postgres:
        condition: service_healthy

  # ------------------------------------------------------------------
  # Dagster webserver — serves the Dagster UI and GraphQL API.
  # NO host-published port: Dagster OSS has no built-in auth.
  # Reachable only via BFF proxy (Task 1.5.3) or API passthrough
  # (Task 1.5.4) from outside the docker network.
  # Dagster storage uses the dedicated `dagster` postgres DB to avoid
  # alembic_version table collisions with the app's own migrations.
  # ------------------------------------------------------------------
  dagster-webserver:
    image: ghcr.io/freesidenomad/quant-platform:${IMAGE_TAG:-main-latest}
    build:
      context: .
    # Named volumes are root-owned; run as root (no host port — internal only).
    user: "0:0"
    command:
      - dagster-webserver
      - -h
      - "0.0.0.0"
      - -p
      - "3000"
      - -w
      - /app/apps/api/workspace.yaml
    # Override the image-level HEALTHCHECK (which probes 8000/8080/8001 for the
    # API/BFF/IdP roles). The webserver listens on 3000 only; a GET / returns 200.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/server_info"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    environment:
      DAGSTER_HOME: /var/dagster_home
      DAGSTER_POSTGRES_HOST: postgres
      DAGSTER_POSTGRES_DB: dagster
      DAGSTER_POSTGRES_USER: quant
      DAGSTER_POSTGRES_PASSWORD: quant
      DATABASE_URL: postgresql+asyncpg://quant:quant@postgres:5432/quant
    volumes:
      - dagster_home:/var/dagster_home
      - ./apps/api/dagster.yaml:/var/dagster_home/dagster.yaml:ro
      - ./apps/api:/app/apps/api:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ------------------------------------------------------------------
  # Dagster daemon — runs schedules, sensors, and the run queue.
  # ------------------------------------------------------------------
  dagster-daemon:
    image: ghcr.io/freesidenomad/quant-platform:${IMAGE_TAG:-main-latest}
    build:
      context: .
    user: "0:0"
    command:
      - dagster-daemon
      - run
      - -w
      - /app/apps/api/workspace.yaml
    # The daemon has no HTTP port; disable the image-level healthcheck.
    healthcheck:
      disable: true
    environment:
      DAGSTER_HOME: /var/dagster_home
      DAGSTER_POSTGRES_HOST: postgres
      DAGSTER_POSTGRES_DB: dagster
      DAGSTER_POSTGRES_USER: quant
      DAGSTER_POSTGRES_PASSWORD: quant
      DATABASE_URL: postgresql+asyncpg://quant:quant@postgres:5432/quant
    volumes:
      - dagster_home:/var/dagster_home
      - ./apps/api/dagster.yaml:/var/dagster_home/dagster.yaml:ro
      - ./apps/api:/app/apps/api:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg-data:
  minio-data:
  dagster_home:
