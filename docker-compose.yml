services:
  postgres:
    image: quay.io/tembo/pg16-pgmq:latest
    container_name: pq-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qp}
      POSTGRES_DB: ${POSTGRES_DB:-qp}
    volumes:
      - qp-postgres-data:/var/lib/postgresql/data
      - ./compose/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qp} -d ${POSTGRES_DB:-qp}"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: pq-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - qp-minio-data:/data
    ports:
      - "19000:9000"
      - "19001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-09-16T17-43-14Z
    container_name: pq-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./apps/api/data:/bundled-data:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set qp http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb -p qp/${S3_BUCKET_DEFAULT:-qp-artifacts} &&
      mc mb -p qp/mlflow-artifacts &&
      mc cp /bundled-data/spy_daily.parquet qp/${S3_BUCKET_DEFAULT:-qp-artifacts}/datasets/ohlcv-spy-daily-synthetic/v1/spy_daily.parquet &&
      exit 0
      "

  mlflow:
    build:
      context: ./compose/mlflow
    image: qp-mlflow:v2.16.0-pg
    container_name: pq-mlflow
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER:-qp}:${POSTGRES_PASSWORD:-qp}@postgres:5432/mlflow
      MLFLOW_DEFAULT_ARTIFACT_ROOT: s3://mlflow-artifacts/
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER:-qp}:${POSTGRES_PASSWORD:-qp}@postgres:5432/mlflow
      --default-artifact-root s3://mlflow-artifacts/
    ports:
      - "15000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:5000/health', timeout=2).status==200 else sys.exit(1)"]
      interval: 3s
      timeout: 5s
      retries: 20

  mock-oidc:
    build:
      context: ./compose/mock-oidc
    container_name: pq-mock-oidc
    ports:
      - "14444:4444"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/.well-known/openid-configuration"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrations:
    build:
      context: ./apps/api
    image: qp-api:m1
    container_name: pq-migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-qp}:${POSTGRES_PASSWORD:-qp}@postgres:5432/${POSTGRES_DB:-qp}
    command: ["alembic", "upgrade", "head"]

  api:
    build:
      context: ./apps/api
    image: qp-api:m1
    container_name: pq-api
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      SERVICE_ROLE: api
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-qp}:${POSTGRES_PASSWORD:-qp}@postgres:5432/${POSTGRES_DB:-qp}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      OIDC_ISSUER: http://mock-oidc:4444
    ports:
      - "18000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  ui:
    build:
      context: ./apps/ui
    container_name: pq-ui
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "15173:5173"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: ./apps/api
    image: qp-api:m1
    container_name: pq-worker
    profiles: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      SERVICE_ROLE: worker_training
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-qp}:${POSTGRES_PASSWORD:-qp}@postgres:5432/${POSTGRES_DB:-qp}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "5678:5678"   # debugpy

volumes:
  qp-postgres-data:
  qp-minio-data:
