[project]
name = "quantplatform"
version = "0.3.1"
description = "Quant Platform SDK + pq CLI"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "pydantic>=2.8",
  "polars-lts-cpu>=1.8",
  "numpy>=2.0",
  "scipy>=1.14",
  "lightgbm>=4.5",
  "mlflow-skinny>=2.16,<3.0",
  "jinja2>=3.1",
  "xxhash>=3.5",
  "psycopg2-binary>=2.9",
  "boto3>=1.34",
  "scikit-learn>=1.5",
  "pandas>=2.0",
  "pyarrow>=24.0.0",
]

[project.scripts]
pq = "quantplatform.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantplatform"]

[tool.hatch.build.targets.wheel.force-include]
"src/quantplatform/templates" = "quantplatform/templates"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "pyright>=1.1.380",
  "hypothesis>=6.115",
  "debugpy>=1.8",
  "testcontainers[postgres]>=4.8",
]

[tool.pytest.ini_options]
# When run from packages/sdk, enforce 100% line coverage on validation module.
# Other modules (cli/) already have their own tests and are excluded here so
# this gate doesn't fail on unrelated drift.
addopts = "--cov=quantplatform.validation --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = false
source = ["src/quantplatform/validation"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
