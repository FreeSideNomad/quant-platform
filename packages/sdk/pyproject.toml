[project]
name = "quantplatform"
version = "0.1.0"
description = "Quant Platform SDK + qp CLI"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "pydantic>=2.8",
  "polars-lts-cpu>=1.8",
  "numpy>=2.0",
  "scipy>=1.14",
]

[project.scripts]
qp = "quantplatform.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantplatform"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "pyright>=1.1.380",
  "hypothesis>=6.115",
]
