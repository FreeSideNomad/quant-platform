name: E2E · after deploy

# Runs Playwright against the deployed URL once `Deploy · dev VM` succeeds.
# Uses the official Playwright docker image so browsers are preinstalled —
# ~15 s faster than installing them at job start, and pinned to the same
# Playwright version our repo uses.

on:
  workflow_run:
    workflows: ["Deploy · dev VM"]
    types: [completed]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL (default: https://quant.ledgertm.com)"
        required: false
        default: "https://quant.ledgertm.com"

concurrency:
  group: e2e-after-deploy
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright happy path
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    # Preinstalled Chromium/Firefox/WebKit — keep this version in sync with
    # the @playwright/test version in apps/web/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
      options: --ipc=host
    env:
      BASE_URL: ${{ inputs.base_url || 'https://quant.ledgertm.com' }}
      # Prevents workspace ownership warnings inside the Playwright image.
      HOME: /root
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - name: Mark git workspace safe
        run: git config --global --add safe.directory '*'

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.11
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile || pnpm install

      # Verify the target is actually reachable before running the tests —
      # gives a clearer failure than a browser timeout.
      - name: Smoke-check target
        run: |
          echo "BASE_URL=$BASE_URL"
          for i in $(seq 1 30); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "$BASE_URL/" || echo err)
            if [ "$code" = "302" ] || [ "$code" = "200" ]; then
              echo "reachable ($code)"; break
            fi
            echo "attempt $i: code=$code"; sleep 3
          done

      - name: Run happy-path e2e
        run: pnpm exec playwright test --reporter=list

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
