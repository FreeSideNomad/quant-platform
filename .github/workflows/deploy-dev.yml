name: Deploy · dev VM

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. main-latest, v0.1.0)"
        required: false
        default: main-latest
  workflow_run:
    workflows: ["Publish image"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull image and compose up on dev VM
    runs-on: [self-hosted, linux, x64, vm-runner, quant]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success')
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.image_tag || 'main-latest' }}
      COMPOSE_FILE: docker-compose.yml:docker-compose.vm.yml
      QUANT_DB_PASSWORD: ${{ secrets.QUANT_DB_PASSWORD }}
      SESSION_JWT_SIGNING_KEY: ${{ secrets.SESSION_JWT_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull image
        run: docker pull "$IMAGE"

      - name: Run Alembic migrations
        run: |
          docker run --rm \
            -e DATABASE_URL="postgresql+asyncpg://quant:${QUANT_DB_PASSWORD}@infra-postgres:5432/quant" \
            -e SESSION_JWT_SIGNING_KEY="${SESSION_JWT_SIGNING_KEY}" \
            --network infra \
            "$IMAGE" \
            /bin/sh -c "alembic upgrade head"

      - name: Compose up
        run: docker compose -f docker-compose.yml -f docker-compose.vm.yml up -d --remove-orphans

      - name: Smoke test
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/internal/health; then
              echo; echo "ok"; exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1

      - name: Log out
        if: always()
        run: docker logout ghcr.io
