name: Deploy · dev VM

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. main-latest, v0.1.0)"
        required: false
        default: main-latest
  workflow_run:
    workflows: ["Publish image"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull image and compose up on dev VM
    runs-on: [self-hosted, linux, x64, vm-runner, quant]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success')
    env:
      QUANT_DB_PASSWORD: ${{ secrets.QUANT_DB_PASSWORD }}
      SESSION_JWT_SIGNING_KEY: ${{ secrets.SESSION_JWT_SIGNING_KEY }}
      BFF_TOKEN_ENCRYPTION_KEY_B64: ${{ secrets.BFF_TOKEN_ENCRYPTION_KEY_B64 }}
      IDP_CLIENT_SECRET: ${{ secrets.IDP_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve image ref (lowercase — GHCR requires it)
        id: image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          tag="${{ inputs.image_tag || 'main-latest' }}"
          echo "ref=ghcr.io/${owner}/quant-platform:${tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull image
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: docker pull "$IMAGE"

      - name: Run Alembic migrations
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          docker run --rm \
            -e DATABASE_URL="postgresql+asyncpg://quant:${QUANT_DB_PASSWORD}@infra-postgres:5432/quant" \
            -e SESSION_JWT_SIGNING_KEY="${SESSION_JWT_SIGNING_KEY}" \
            -e BFF_TOKEN_ENCRYPTION_KEY_B64="${BFF_TOKEN_ENCRYPTION_KEY_B64}" \
            --network infra \
            "$IMAGE" \
            /bin/sh -c "alembic upgrade head"

      - name: Compose up
        env:
          IMAGE_TAG: ${{ inputs.image_tag || 'main-latest' }}
        run: |
          docker compose -p quant-platform \
            -f docker-compose.yml -f docker-compose.vm.yml \
            up -d --remove-orphans

      - name: Smoke test
        run: |
          for i in {1..30}; do
            if docker exec quant-platform-api-1 curl -fsS http://localhost:8000/internal/health 2>/dev/null; then
              echo; echo "api up"
              break
            fi
            sleep 2
          done
          # Public endpoint check — goes through Caddy → BFF → redirect to /auth/login
          for i in {1..30}; do
            code=$(curl -sk -o /dev/null -w "%{http_code}" https://quant.ledgertm.com/ || true)
            if [ "$code" = "302" ] || [ "$code" = "200" ]; then
              echo "public ok ($code)"
              exit 0
            fi
            sleep 2
          done
          docker compose -p quant-platform logs --no-color --tail=50
          exit 1

      - name: Log out
        if: always()
        run: docker logout ghcr.io
